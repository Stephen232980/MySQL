<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Responsive Image Gallery</title>

  <!-- Nhúng Bootstrap 5 CSS qua CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Đảm bảo hình ảnh co giãn đều và giữ tỷ lệ khung hình */
    .gallery-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .gallery-img:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark">Thư Viện Ảnh (Responsive Gallery)</h2>
      <p class="text-muted">Desktop: 4 ảnh/dòng | Tablet: 2 ảnh/dòng | Mobile: 1 ảnh/dòng</p>
    </div>

    <!-- Hệ thống lưới: Row với khoảng cách g-4 -->
    <div class="row g-4">

      <!-- Ảnh 1 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80" class="gallery-img card-img-top" alt="Hình 1">
          <div class="card-body text-center py-2">
            <small class="text-muted">Bãi biển mùa hè</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 2 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&q=80" class="gallery-img card-img-top" alt="Hình 2">
          <div class="card-body text-center py-2">
            <small class="text-muted">Cảnh sắc thiên nhiên</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 3 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&q=80" class="gallery-img card-img-top" alt="Hình 3">
          <div class="card-body text-center py-2">
            <small class="text-muted">Rừng nguyên sinh</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 4 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&q=80" class="gallery-img card-img-top" alt="Hình 4">
          <div class="card-body text-center py-2">
            <small class="text-muted">Núi tuyết kỳ vĩ</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 5 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600&q=80" class="gallery-img card-img-top" alt="Hình 5">
          <div class="card-body text-center py-2">
            <small class="text-muted">Hành trình du lịch</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 6 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&q=80" class="gallery-img card-img-top" alt="Hình 6">
          <div class="card-body text-center py-2">
            <small class="text-muted">Hoàng hôn trên hồ</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 7 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=600&q=80" class="gallery-img card-img-top" alt="Hình 7">
          <div class="card-body text-center py-2">
            <small class="text-muted">Ánh nắng ban mai</small>
          </div>
        </div>
      </div>

      <!-- Ảnh 8 -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card border-0 shadow-sm overflow-hidden">
          <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600&q=80" class="gallery-img card-img-top" alt="Hình 8">
          <div class="card-body text-center py-2">
            <small class="text-muted">Con đường mùa thu</small>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Nhúng Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
